name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      # tauri-action reads the release's existing latest.json, merges in this
      # platform's signature, and re-uploads it. Running the matrix in
      # parallel means every job races to read-modify-write that same file on
      # the same release, and the loser's upload can vanish or get clobbered
      # — which is why past releases shipped installers but no latest.json.
      # Serializing the jobs makes each merge step safe.
      max-parallel: 1
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Download binaries (Unix)
        if: matrix.platform != 'windows-latest'
        run: bash scripts/download-binaries.sh ${{ matrix.target }}

      - name: Download binaries (Windows)
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: bash scripts/download-binaries.sh ${{ matrix.target }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'KeepMeTube ${{ github.ref_name }}'
          releaseBody: |
            ## What's Changed

            See commit history for a full list of changes in this release.

            ## Installation

            Download the installer corresponding to your operating system below:
            - **macOS**: Download and open the `.dmg` file.
            - **Windows**: Run the `.msi` or `.exe` installer.
            - **Linux**: Run the `.AppImage` file.
          releaseDraft: false
          # Must stay false: the in-app updater's endpoint is
          # releases/latest/download/, which GitHub resolves only to the
          # newest non-prerelease release.
          prerelease: false
          args: ${{ matrix.args }}
